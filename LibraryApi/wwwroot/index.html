<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library API</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">📚 Library API</div>
    <div class="nav-right">
      <span id="nav-username" class="nav-username"></span>
      <button id="logout-btn" class="btn btn-outline hidden">Logout</button>
    </div>
  </nav>

  <div id="toast-container"></div>

  <!-- ── Login ─────────────────────────────────────────────────── -->
  <section id="login-section" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">📚</div>
      <h2>Library API</h2>
      <p class="auth-subtitle">Sign in to manage your library</p>
      <form id="login-form" autocomplete="on">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span id="login-label">Sign In</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </section>

  <!-- ── Main App ───────────────────────────────────────────────── -->
  <main id="main-section" class="hidden">
    <div class="toolbar">
      <div class="toolbar-left">
        <h1>My Library <span id="book-count" class="badge"></span></h1>
      </div>
      <div class="toolbar-right">
        <button id="export-btn" class="btn btn-outline">⬇ Export</button>
        <button id="history-btn" class="btn btn-outline">📋 History</button>
        <button id="refresh-btn" class="btn btn-outline">↺ Refresh</button>
        <button id="open-add-btn" class="btn btn-primary">+ Add Book</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button id="filter-all-btn" class="filter-btn active">All books</button>
      <button id="filter-fav-btn" class="filter-btn">⭐ Favorites</button>
      <button id="filter-toread-btn" class="filter-btn">📚 To Read</button>
      <button id="filter-reading-btn" class="filter-btn">📖 Reading</button>
      <button id="filter-read-btn" class="filter-btn">✓ Read</button>
    </div>

    <!-- Google Books search bar -->
    <div class="search-section">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="google-search-input"
               placeholder="Search Google Books to add…" autocomplete="off">
        <button class="btn btn-secondary btn-sm search-clear hidden" id="search-clear-btn">×</button>
        <div class="search-dropdown hidden" id="search-dropdown"></div>
      </div>
    </div>

    <div id="books-grid" class="books-grid">
      <div class="loading-grid" id="loading-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">📖</div>
        <p>No books yet.</p>
        <button class="btn btn-primary" id="empty-add-btn">Add your first book</button>
      </div>
    </div>
  </main>

  <!-- ── Add Book Modal ─────────────────────────────────────────── -->
  <div id="add-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="add-modal"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3>Add New Book</h3>
        <button class="close-btn" data-close="add-modal">×</button>
      </div>
      <form id="add-book-form">
        <input type="hidden" id="add-google-thumbnail">

        <label for="add-title">Title <span class="required">*</span></label>
        <input type="text" id="add-title" required maxlength="100" placeholder="Enter book title">

        <label for="add-author">Author <span class="required">*</span></label>
        <input type="text" id="add-author" required maxlength="100" placeholder="Enter author name">

        <div class="form-row">
          <div>
            <label for="add-year">Published Year <span class="required">*</span></label>
            <input type="number" id="add-year" required min="1" max="9999" placeholder="2024">
          </div>
          <div>
            <label for="add-type">Book Type</label>
            <select id="add-type">
              <option value="0">📖 Physical</option>
              <option value="1">💻 Ebook</option>
              <option value="2">🎧 Audiobook</option>
            </select>
          </div>
        </div>

        <label for="add-genre">Genre <span class="required">*</span></label>
        <input type="text" id="add-genre" required maxlength="50" placeholder="e.g. Science Fiction">

        <label for="add-description">Description <span class="optional">(optional)</span></label>
        <div class="description-group">
          <textarea id="add-description" rows="3" placeholder="Book description..."></textarea>
          <button type="button" class="btn btn-outline btn-generate" id="add-generate-btn">✨ Generate</button>
        </div>

        <label for="add-notes">📝 Notes <span class="optional">(private)</span></label>
        <textarea id="add-notes" rows="3" class="notes-textarea" placeholder="Personal notes, reading status, quotes…"></textarea>

        <label for="add-cover">Cover Image <span class="optional">(optional)</span></label>
        <div class="file-upload-area">
          <input type="file" id="add-cover" accept="image/*">
          <img id="add-cover-preview" class="upload-preview hidden" alt="Cover preview">
          <div class="upload-placeholder" id="add-cover-placeholder">
            <span class="upload-icon">🖼</span>
            <span>Click to upload or drag &amp; drop</span>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close="add-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Edit Book Modal ────────────────────────────────────────── -->
  <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="edit-modal"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Book</h3>
        <button class="close-btn" data-close="edit-modal">×</button>
      </div>
      <form id="edit-book-form">
        <input type="hidden" id="edit-id">

        <label for="edit-title">Title <span class="required">*</span></label>
        <input type="text" id="edit-title" required maxlength="100">

        <label for="edit-author">Author <span class="required">*</span></label>
        <input type="text" id="edit-author" required maxlength="100">

        <div class="form-row">
          <div>
            <label for="edit-year">Published Year <span class="required">*</span></label>
            <input type="number" id="edit-year" required min="1" max="9999">
          </div>
          <div>
            <label for="edit-type">Book Type</label>
            <select id="edit-type">
              <option value="0">📖 Physical</option>
              <option value="1">💻 Ebook</option>
              <option value="2">🎧 Audiobook</option>
            </select>
          </div>
        </div>

        <label for="edit-genre">Genre <span class="required">*</span></label>
        <input type="text" id="edit-genre" required maxlength="50">

        <label for="edit-description">Description <span class="optional">(optional)</span></label>
        <div class="description-group">
          <textarea id="edit-description" rows="3" placeholder="Book description..."></textarea>
          <button type="button" class="btn btn-outline btn-generate" id="edit-generate-btn">✨ Generate</button>
        </div>

        <label for="edit-notes">📝 Notes <span class="optional">(private)</span></label>
        <textarea id="edit-notes" rows="4" class="notes-textarea" placeholder="Personal notes, reading status, quotes…"></textarea>

        <label for="edit-cover">Cover Image <span class="optional">(Azure Blob Storage)</span></label>
        <div class="file-upload-area">
          <input type="file" id="edit-cover" accept="image/*">
          <img id="edit-cover-preview" class="upload-preview hidden" alt="Cover preview">
          <div class="upload-placeholder" id="edit-cover-placeholder">
            <span class="upload-icon">🖼</span>
            <span>Click to upload or drag &amp; drop</span>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close="edit-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Book Detail Modal ─────────────────────────────────────── -->
  <div id="detail-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="detail-modal"></div>
    <div class="modal-box modal-detail">
      <div class="modal-header">
        <h3 id="detail-modal-title">Book Details</h3>
        <button class="close-btn" data-close="detail-modal">×</button>
      </div>
      <div class="detail-content">
        <div class="detail-cover-col">
          <div class="detail-cover" id="detail-cover"></div>
        </div>
        <div class="detail-info-col">
          <div class="detail-badges" id="detail-badges"></div>
          <h2 class="detail-book-title" id="detail-book-title"></h2>
          <p class="detail-author" id="detail-author"></p>
          <div class="detail-meta" id="detail-meta"></div>
          <p class="detail-description" id="detail-description"></p>
          <div class="detail-notes-box hidden" id="detail-notes"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="detail-modal">Close</button>
        <button type="button" class="btn btn-primary" id="detail-edit-btn">✏ Edit</button>
      </div>
    </div>
  </div>

  <!-- ── Command History Modal ──────────────────────────────────── -->
  <div id="history-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="history-modal"></div>
    <div class="modal-box modal-wide">
      <div class="modal-header">
        <h3>📋 Command History</h3>
        <button class="close-btn" data-close="history-modal">×</button>
      </div>
      <div id="history-content" class="history-content">
        <p class="loading-text">Loading...</p>
      </div>
    </div>
  </div>

  <!-- ── Confirm Delete Modal ───────────────────────────────────── -->
  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="confirm-modal"></div>
    <div class="modal-box modal-sm">
      <div class="modal-header">
        <h3>Delete Book</h3>
        <button class="close-btn" data-close="confirm-modal">×</button>
      </div>
      <p id="confirm-text" class="confirm-text"></p>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="confirm-modal">Cancel</button>
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
